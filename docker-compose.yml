services:
  frontend:
    image: piyumi00/devops_project_frontend:latest
    container_name: housezone-frontend
    ports:
      - "5173:5173"  # maps container port to EC2 port
    depends_on:
      - backend
    environment:
      # Use your Public AWS IP so the browser can reach the API
      - VITE_API_URL=http://98.93.212.39:3000
      - VITE_HOST=0.0.0.0      # <-- Add this so Vite listens on all interfaces
    networks:
      - housezone_net

  backend:
    image: piyumi00/devops_project_backend:latest
    container_name: housezone-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend_new/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend_new/uploads:/app/uploads:rw 
    networks:
      - housezone_net

  db:
    image: mysql:8
    container_name: housezone-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: new_find_house
    expose:
      - "3306"  # internal use only, not public
    volumes:
      - db_data:/var/lib/mysql
      - ./backend_new/db/properties.sql:/docker-entrypoint-initdb.d/properties.sql
    networks:
      - housezone_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  housezone_net:
